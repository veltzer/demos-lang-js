# The three iframe race-condition demos deliberately carry near-identical
# tiny servers so each variant is self-contained; batched pylint's cross-file
# duplicate check (R0801) flags exactly that. Per-file runs keep every
# per-file check.
[processor.pylint]
batch = false

# Same duplication rationale for mypy: three server.py files, one namespace
# under batching ("Duplicate module"). Per-file runs keep all checks.
[processor.mypy]
batch = false

# Runtime deps so CI installs what the code imports.
# The Makefile ran eslint over src/**/*.js with the old .eslintrc.js. eslint 9/10
# dropped .eslintrc.* for flat config, so the config now lives at
# config/eslint.config.js (js.configs.recommended + eslint-plugin-html for
# scripts embedded in HTML, with the same demo-noise rules off and library
# globals declared). hello_wrong.js is a deliberately malformed demo -- a .js
# file that is really HTML, showing the browser won't render it; it carried the
# Makefile's NOJSHINT/NOESLINT opt-out, so it is excluded here too.
[processor.eslint]
src_dirs = ["src"]
args = ["-c", "config/eslint.config.js"]
src_exclude_paths = ["src/core/examples/browser/hello_wrong.js"]

[dependencies]
pip = [
    "flask",
]
npm = [
    "eslint",
    "@eslint/js",
    "eslint-plugin-html",
]
