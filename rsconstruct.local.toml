# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# The pydmt-era Makefile ran tidy through `pymakehelper run_with_ignore $< NOTIDY`:
# any html file carrying a "FLAGS: ... NOTIDY" comment opted out of tidy, by
# the author's own in-file directive (dojo pages use proprietary dojo
# attributes; a few demos deliberately show markup tidy rejects, like
# document.write after </body>). This carries that exact convention over.
# args carries the repo's own .tidy.config, as the Makefile did.
[processor.tidy]
args = ["-config", ".tidy.config"]
src_exclude_paths = [
    "src/core/examples/browser/hello2.html",
    "src/core/examples/browser/hello3.html",
    "src/core/examples/debug/document_write.html",
    "src/core/examples/dom/document_write.html",
