<!DOCTYPE html>
<html>
	<head>
		<title>Tables</title>
	</head>
	<body>
		<table border="3">
			<tr>
				<td colspan="2" style="height: 100px; background-color: #00ff00;">&nbsp;</td>
				<td rowspan="2" style="width: 100px; background-color: #0000ff;">&nbsp;</td>
			</tr>
			<tr>
				<td rowspan="2" style="width: 100px; background-color: #ff0000;">&nbsp;</td>
				<td style="height: 100px; width: 100px;">&nbsp;</td>
			</tr>
			<tr>
				<td colspan="2" style="height: 100px; background-color: #ff00ff;">&nbsp;</td>
			</tr>
		</table>
	</body>
</html>
