<!DOCTYPE html>
<html>
	<head>
		<title>Matrices</title>
		<style>
			table td { padding: 5px; }
			table table td { padding: 1px; }
		</style>
	</head>
	<body>
		<h1 style="text-align: left;">Matrix</h1>
		<p><!-- Start of Simple Table --></p>
		<div style="text-align: center;">
			<table border="10" style="border-color: blue; border-spacing: 2px; width: 95%;">
		<tr>
			<td rowspan="3" style="vertical-align: middle; width: 20%; background-image: url(BackGround.gif);"></td>
			<td colspan="2" style="vertical-align: middle;">This is my table</td>
		</tr>
		<tr>
			<td style="vertical-align: top; width: 40%;">&nbsp;</td>
			<td style="vertical-align: middle;"><!-- Nested Table --><br>
			<table border="0" style="border-spacing: 2px; width: 100%;">
				<tr>
					<td colspan="2" style="vertical-align: middle; text-align: center;"><b>Title</b></td>
				</tr>
				<tr>
					<td style="vertical-align: middle; text-align: center;">first</td>
					<td style="vertical-align: middle; text-align: center;">third</td>
				</tr>
				<tr>
					<td style="vertical-align: middle; text-align: center;">second</td>
					<td style="vertical-align: middle; text-align: center;">fourth</td>
				</tr>
			</table>
			</td></tr><tr>
		<td style="vertical-align: middle;"><p style="text-align: right;">Cell number 1</p></td>
		<td style="vertical-align: middle;"><p>Cell number 2</p></td></tr></table>
		</div>
		<p>&nbsp;</p>
		<p style="color:black;"><br>&nbsp;</p>
	</body>
</html>
