<!DOCTYPE html>
<html>
	<head>
		<title>Hello, Tree!</title>
		<script src="../toolkits/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<script>
			dojo.require("dojo.data.ItemFileReadStore");
			dojo.require("dijit.Tree");
			dojo.require("dijit.form.TextBox");
			function _do_click(item,_node) {
				var w_tree=dijit.byId("tree");
				var w_textbox=dijit.byId("textbox");
				w_textbox.attr("value",w_tree.store.getLabel(item));
			}
			function do_sub(e) {
				// e.item is the item which is involved in the event.
				// e.tree is the tree involved in the event
				/*
				// remenants of some debugging code
				for(x in e) {
					console.debug(x+": "+e[x]);
				}
				*/
				var w_textbox=dijit.byId("textbox2");
				w_textbox.attr("value",e.tree.store.getLabel(e.item));
			}
			function do_init() {
				// note that we subscribe on the ID of the tree in question...
				dojo.subscribe("tree",do_sub);
			}
			dojo.addOnLoad(do_init);
		</script>
	</head>
	<body class="tundra">
		<div data-dojo-type="dojo.data.ItemFileReadStore" data-dojo-props="url:'tree.ajax'"
			id="store"
			data-dojo-id="popStore">
		</div>

		<div data-dojo-type="dijit.Tree" data-dojo-props="store:popStore, label:'Pop Tarts'"
			id="tree"
			onclick="_do_click">
		</div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="textbox" title="selection"></div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="textbox2" title="selection"></div>
	</body>
</html>
