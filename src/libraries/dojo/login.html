<!DOCTYPE html>
<html>
	<head>
		<title>Login page exercise</title>
		<script src="../toolkits/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<script>
			dojo.require("dijit.form.ValidationTextBox");
			dojo.require("dijit.form.Button");
			dojo.require("dojo.data.ItemFileReadStore");
			dojo.require("dijit.form.ComboBox");
			dojo.require("dojox.form.PasswordValidator");
			dojo.require("dijit.form.Form");
			function imchange(newval) {
				var cb=dijit.byId("imId");
				cb.attr("disabled",newval=="None");
			}
			function formstatechange(newstate) {
				dijit.byId("submitid").attr("disabled",!newstate);
			}
			function init() {
				var store=new dojo.data.ItemFileReadStore({url:"login.ajax"});
				var cb=dijit.byId("im");
				cb.attr("store",store);
				cb.attr("searchAttr","imname");
				dojo.connect(cb,"onChange",imchange);

				var form=dijit.byId("formid");
				dojo.connect(form,"onValidStateChange",formstatechange);
			}
			dojo.addOnLoad(init);
			function _register() {
				dojo.xhrGet();
			}
			function _pwCheck(val) {
				//alert("in pwCheck "+val);
				return val=="password";
			}
		</script>
	</head>
	<body class="tundra">
		<form id="formid" data-dojo-type="dijit.form.Form">
		First Name<div
			id="first_name"
			data-dojo-type="dijit.form.ValidationTextBox" data-dojo-props="type:'text', name:'firstName', required:true, propercase:true, regExp:'^[a-zA-Z]+$', maxLength:10, promptMessage:'Enter your first name', invalidMessage:'First name is required', trim:true"
		></div>
		<br>
		Last Name<div
			id="last_name"
			data-dojo-type="dijit.form.ValidationTextBox" data-dojo-props="type:'text', name:'lastName', required:true, propercase:true, regExp:'^[a-zA-Z]+$', maxLength:10, promptMessage:'Enter your last name', invalidMessage:'Last name is required', trim:true"
		></div>
		<br>
		<div data-dojo-type="dojox.form.PasswordValidator" data-dojo-props="name:'pwValidate', pwCheck:_pwCheck">
			<!--
			Old password<input type="password" data-dojo-props="pwType:'old'"/><br>
			-->
			New password<input type="password" data-dojo-props="pwType:'new'"/><br>
			Verify new password<input type="password" data-dojo-props="pwType:'verify'"/><br>
		</div>
		<div data-dojo-type="dijit.form.ComboBox" data-dojo-props="value:'Enter your IM system'" id="im"></div>
		<br>
		IM id<div
			id="im_id"
			data-dojo-type="dijit.form.ValidationTextBox" data-dojo-props="type:'text', name:'IMid', required:true, propercase:true, regExp:'^[0-9a-zA-Z]+$', maxLength:10, promptMessage:'Enter your IM id', invalidMessage:'IM id is required', trim:true"
		></div>
		<br>
		<div id="submitid" data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" title="click to see an alert" onclick="_register">Register to this website</div>
		</form>
	</body>
</html>
