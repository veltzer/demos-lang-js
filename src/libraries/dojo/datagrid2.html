<!DOCTYPE html>
<!--
	This enhanced the previous example by loading data and modifying it.
-->
<html>
	<head>
		<title>Hello, DataGrid world!</title>
		<script src="../toolkits/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojox/grid/resources/Grid.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojox/grid/resources/tundraGrid.css"/>
		<script src="datagrid2.js"></script>
	</head>
	<body class="tundra">
		<div id="mydatastore" data-dojo-type="dojo.data.ItemFileWriteStore" data-dojo-props="url:'datagrid2.ajax'" data-dojo-id="mystore"></div>
		<div id="grid" data-dojo-type="dojox.grid.DataGrid" data-dojo-props="store:mystore, structure:layout"></div>
		<div id="grid2" data-dojo-type="dojox.grid.DataGrid" data-dojo-props="store:mystore, structure:layout2"></div>
		<div id="button" data-dojo-type="dijit.form.Button" onclick="do_click">Modify Data</div>
		<div id="button2" data-dojo-type="dijit.form.Button" onclick="do_populate">Populate</div>
	</body>
</html>
