<!DOCTYPE html>
<html>
	<head>
		<title>Hello, World!</title>
		<script src="dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<style>
			@import "dojo/dijit/themes/tundra/tundra.css";
			@import "dojo/dojo/resources/dojo.css";
		</style>
		<script>
			dojo.require("dijit.form.Button");
			dojo.require("dijit.form.ValidationTextBox");
			dojo.require("dijit.form.TextBox");
			dojo.require("dojo.data.ItemFileReadStore");
			dojo.require("dijit.form.FilteringSelect");
			dojo.require("dijit.form.DateTextBox");
			dojo.require("dijit.form.NumberTextBox");
			function _do_check_state() {
				var valid = dijit.byId("first_name").isValid() && dijit.byId("age").isValid() && dijit.byId("hobby").isValid() && dijit.byId("bd").isValid();
				dijit.byId("go").attr("disabled",!valid);
			}
			function _do_alert() {
				alert("Boom!");
			}
		</script>
	</head>

	<body class="tundra">
		<div data-dojo-type="dojo.data.ItemFileReadStore" data-dojo-props="url:'ex6.ajax'" data-dojo-id="hobbies"></div>
		Name : <div data-dojo-type="dijit.form.ValidationTextBox" data-dojo-props="regExp:'^[a-zA-Z ]+$', required:true, invalidMessage:'Must be alpha.'" id="first_name" onBlur="_do_check_state"></div>
		<br>
		Age : <div data-dojo-type="dijit.form.NumberTextBox" data-dojo-props="invalidMessage:'Must be numeric.'" id="age" onBlur="_do_check_state"></div>
		<br>
		Hobby : <div data-dojo-type="dijit.form.FilteringSelect" data-dojo-props="autoComplete:true, value:'Enter your hobby', store:hobbies, searchAttr:'hobby'" id="hobby" onBlur="_do_check_state"></div>
		<br>
		Birth Date : <div data-dojo-type="dijit.form.DateTextBox" id="bd" onBlur="_do_check_state"></div>
		<br>
		Password : <input type="password" data-dojo-type="dijit.form.TextBox" id="password" onBlur="_do_check_state"/>
		<br>
		<div data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" id="go" onclick="_do_alert">Go!</div>

	</body>
</html>
