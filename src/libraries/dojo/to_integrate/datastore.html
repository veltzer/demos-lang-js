<!DOCTYPE html>
<html>
	<head>
	<title> Dojo: Data Store Example </title>
	<script src="/myapp/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true, preventBackButtonFix:false"></script>
	<style type="text/css">
		@import "/myapp/dojo/dijit/themes/tundra/tundra.css";
		@import "/myapp/dojo/dojo/resources/dojo.css";
	</style>
	<script>
		dojo.require("dijit.form.Button");
		dojo.require("dijit.form.TextBox");
		dojo.require("dojo.data.ItemFileReadStore");

		var startPoint = 0;
		var store;
		function initialization()
		{
			store = new dojo.data.ItemFileReadStore({url: "items.ajax"});
			getData();
		}
		function getData()
		{
			var _request = store.fetch({ start: startPoint , count: 3, onComplete: showCurrent})
		}
		dojo.addOnLoad(initialization);
		function showCurrent(items,_request)
		{
			if (items.length<3)
			{
				alert("no more data");
				dijit.byId("nextButton").attr("disabled",true);
				return
			}
			if (items.length>=1)
			{
				var firstItem = items[0];
				dijit.byId("dataOne").attr("value",firstItem.name);
			}
			if (items.length>=2)
			{
				var secondItem = items[1];
				dijit.byId("dataTwo").attr("value",secondItem.name);
			}
			if (items.length>=3)
			{
				var thirdItem = items[2];
				dijit.byId("dataThree").attr("value",thirdItem.name);
			}
			if (items.length==3)
				dijit.byId("nextButton").attr("disabled",false);
		}
		function _do_next()
		{
			if (startPoint==0)
				dijit.byId("prevButton").attr("disabled",false);
			startPoint+=1;
			getData();
		}
		function _do_prev()
		{
			startPoint-=1;
			getData();
			if (startPoint==0)
				dijit.byId("prevButton").attr("disabled",true);
		}
	</script>
	</head>
	<body class="tundra">
		<div data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" id="prevButton" onclick="_do_prev">Prev</div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataOne">	</div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataTwo">	</div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataThree">	</div>
		<div data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" id="nextButton" onclick="_do_next">Next</div>
	</body>
</html>
