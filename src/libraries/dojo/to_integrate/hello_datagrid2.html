<!DOCTYPE html>
<html>
	<!--
		This enhanced the previous example by loading data
		and modifying it.
	-->
	<head>
		<title>Hello, DataGrid world!</title>
		<script src="dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true, isDebug:false"></script>
		<style type="text/css">
			@import "dojo/dijit/themes/tundra/tundra.css";
			@import "dojo/dojox/grid/resources/Grid.css";
			@import "dojo/dojox/grid/resources/tundraGrid.css";
			@import "dojo/dojo/resources/dojo.css";
		</style>
		<script>
			dojo.require("dojox.grid.DataGrid");
			dojo.require("dojo.data.ItemFileWriteStore");
			dojo.require("dijit.form.Button");
			var layout=[
				{ name: "Product", field: "product" },
				{ name: "Price", field: "price" }
			];
			function init() {
				// load some data
			}
			function _do_click() {
				var w=dijit.byId("grid");
				var store=w.store;
				for(var i=0;i<w.rowCount;i++) {
					var item=w.getItem(i);
					var old_price=store.getValue(item,"price");
					var new_price=old_price*1.15;
					store.setValue(item,"price",new_price);
				}
			}
			function _do_populate() {
				// create some data
			}
			dojo.addOnLoad(init);
		</script>
	</head>
	<body class="tundra">
		<div id="mydatastore"
			data-dojo-type="dojo.data.ItemFileWriteStore" data-dojo-props="url:'hello_datagrid2.ajax'"
			data-dojo-id="mystore"
		>
		</div>
		<div id="grid" data-dojo-type="dojox.grid.DataGrid" data-dojo-props="store:mystore, structure:layout"></div>
		<div id="button" data-dojo-type="dijit.form.Button" onclick="_do_click">Modify Data</div>
		<div id="button2" data-dojo-type="dijit.form.Button" onclick="_do_populate">Populate</div>
	</body>
</html>
