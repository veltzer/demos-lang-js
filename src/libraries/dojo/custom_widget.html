<!DOCTYPE html>
<!--
	This is a solution to the exercise for widget writing.
-->
<html>
	<head>
		<title>Hello, Roller</title>
		<script>
			window.dojoConfig={
				parseOnLoad:true,
				modulePaths: {
					extend: "../../../dojo/extend"
				}
			}
		</script>
		<script src="../toolkits/dojo/dojo/dojo.js"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<script>
			dojo.require("extend.Roller");
		</script>
	</head>
	<body class="tundra">
		<div data-dojo-type="extend.Roller" data-dojo-props="initVal:50, incVal:5, decVal:8, maxVal:100"></div>
		<div data-dojo-type="extend.Roller" data-dojo-props="initVal:5, incVal:1, decVal:1, maxVal:10"></div>
	</body>
</html>
