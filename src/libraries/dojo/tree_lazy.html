<!DOCTYPE html>
<html>
	<head>
		<title>Hello, Lazy Tree!</title>
		<script src="../toolkits/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<script>
			dojo.require("dijit.tree.ForestStoreModel");
			dojo.require("dojox.data.QueryReadStore");
			dojo.require("dijit.Tree");
			dojo.provide("my.ForestStoreModel");
			dojo.declare("my.ForestStoreModel", dijit.tree.ForestStoreModel, {
				getChildren: function(parentItem, complete_cb, error_cb) {
					var root="/";
					var mypath
					if (parentItem.root == true) {
						mypath = root;
					}
					else {
						mypath = this.store.getValue(parentItem, "path");
					}
					this.store.fetch({ query: {path: mypath+root},
						onComplete: complete_cb,
						onError: error_cb
					});
					// Call superclasses" getChildren
					return this.inherited(arguments);
				}
			});
		</script>
	</head>
	<body class="tundra">
		<div data-dojo-type="dojox.data.QueryReadStore" data-dojo-props="url:'tree_lazy.php'"
			data-dojo-id="treeStore">
		</div>
		<div data-dojo-type="my.ForestStoreModel" data-dojo-props="store:treeStore, rootId:'/', rootLabel:'/', query:{ path: '/' }, childrenAttrs:['children']"
			data-dojo-id="treeModel">
		</div>
		<div data-dojo-type="dijit.Tree" data-dojo-props="model:treeModel, persist:false"
			data-dojo-id="itemTree">
			<script type="dojo/method" data-dojo-event="onClick" data-dojo-args="item">
				alert("you clicked: " + treeStore.getLabel(item));
			</script>
		</div>
	</body>
</html>
