<!DOCTYPE html>
<!--
	Data store example
-->
<html>
	<head>
		<title>Dojo: Data Store Example</title>
		<script src="../toolkits/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:true"></script>
		<link rel="stylesheet" href="../toolkits/dojo/dijit/themes/tundra/tundra.css"/>
		<link rel="stylesheet" href="../toolkits/dojo/dojo/resources/dojo.css"/>
		<script src="data.js"></script>
	</head>
	<body class="tundra">
		<div data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" id="prevButton" onclick="prev">Prev</div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataOne"></div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataTwo"></div>
		<div data-dojo-type="dijit.form.TextBox" data-dojo-props="disabled:true" id="dataThree"></div>
		<div data-dojo-type="dijit.form.Button" data-dojo-props="disabled:true" id="nextButton" onclick="next">Next</div>
	</body>
</html>
