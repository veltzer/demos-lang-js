# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "config"]

batch = false

[processor.mypy]
src_dirs = ["src", "config"]
batch = false

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["src", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# not linted: not_mine (third-party file, see directory name)
[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]
args = ["-config", ".tidy.config"]

# not linted: toolkits (vendored libraries: raphael, prototype, jquery.mobile)
[processor.oxlint]
src_dirs = ["src", "nodejs", "to_integrate/async"]
args = ["-c", ".oxlintrc.json"]

# ─── repo-specific configuration ────────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["nodejs/exercises"]
src_files = ["README.md"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_dirs = ["nodejs/exercises", "src/core", "support"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["src/core/examples/html5/solutions/websockets/WebContent/WEB-INF"]

# ─── php ─────────────────────────────────────────────────────────────────────

[processor.php_lint]
src_dirs = ["src"]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["src/core/examples/html5"]
args = ["-c", "checkstyle.xml"]

# ─── css ─────────────────────────────────────────────────────────────────────

# not linted: toolkits (vendored libraries: raphael, prototype, jquery.mobile)
# Only .css is passed: biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.biome]
src_dirs = ["src"]
src_extensions = [".css"]
